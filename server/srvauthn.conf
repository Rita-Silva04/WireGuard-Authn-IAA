[server]
wg_interface        = wg0
wg_listen_port      = 51820
# Paste the value from scripts/init-wg.sh (cat wireguard/publickey-server).
wg_public_key       = 6rrFfOUdFk7jjtN8m6YCm8cJybcDVc5vmI59INhLi08=
# §1.2 — server's WG private key, loaded at startup.
