<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}VPN Helpdesk{% endblock %}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f6f8;color:#1a1a1a;padding:24px}
h1{font-size:1.5rem;margin-bottom:4px}
h2{font-size:1.1rem;margin:20px 0 10px;color:#444}
.sub{color:#777;font-size:.85rem;margin-bottom:20px}
a{color:#1a6fd4;text-decoration:none}
a:hover{text-decoration:underline}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #e0e0e0;font-size:.9rem}
th{color:#666;font-weight:600;font-size:.78rem;text-transform:uppercase}
tr:hover td{background:#f0f4ff}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.75rem;font-weight:600}
.badge-ok{background:#d4edda;color:#1a7a3c}
.badge-no{background:#e9ecef;color:#888}
.badge-warn{background:#fff3cd;color:#856404}
input[type=text],input[type=password]{width:100%;padding:9px 12px;
  background:#fff;border:1px solid #ccc;border-radius:6px;color:#1a1a1a;font-size:.95rem}
.btn{display:inline-block;padding:8px 16px;border:none;border-radius:6px;
     font-size:.88rem;cursor:pointer;font-weight:600;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:#1a6fd4;color:#fff}
.btn-danger{background:#c0392b;color:#fff}
.btn-secondary{background:#fff;color:#444;border:1px solid #ccc}
.btn-sm{padding:5px 12px;font-size:.8rem}
.card{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:20px;margin-bottom:20px}
.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.err{background:#fde8e8;color:#c0392b;padding:10px 14px;border-radius:6px;font-size:.88rem;margin-bottom:12px}
.ok{background:#d4edda;color:#1a7a3c;padding:10px 14px;border-radius:6px;font-size:.88rem;margin-bottom:12px}
label{display:block;font-size:.82rem;color:#666;margin-bottom:4px;margin-top:12px}
nav{margin-bottom:20px;color:#888}
#msg{display:none;margin-top:10px}
</style>
{% block head %}{% endblock %}
</head>
<body>
{% block nav %}{% endblock %}
{% block content %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
