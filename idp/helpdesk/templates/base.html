<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}VPN Helpdesk{% endblock %}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#0f0f0f;color:#eee;padding:24px}
h1{font-size:1.5rem;margin-bottom:4px}
h2{font-size:1.1rem;margin:20px 0 10px;color:#aaa}
.sub{color:#666;font-size:.85rem;margin-bottom:20px}
a{color:#4f8ef7;text-decoration:none}
a:hover{text-decoration:underline}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #2a2a2a;font-size:.9rem}
th{color:#888;font-weight:600;font-size:.78rem;text-transform:uppercase}
tr:hover td{background:#1a1a1a}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.75rem;font-weight:600}
.badge-ok{background:#1a3d2b;color:#6fcf97}
.badge-no{background:#2a2a2a;color:#666}
.badge-warn{background:#3d2a1a;color:#f0a500}
input[type=text],input[type=password]{width:100%;padding:9px 12px;
  background:#1e1e1e;border:1px solid #333;border-radius:6px;color:#fff;font-size:.95rem}
.btn{display:inline-block;padding:8px 16px;border:none;border-radius:6px;
     font-size:.88rem;cursor:pointer;font-weight:600;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:#4f8ef7;color:#fff}
.btn-danger{background:#c0392b;color:#fff}
.btn-secondary{background:#2a2a2a;color:#ccc;border:1px solid #333}
.btn-sm{padding:5px 12px;font-size:.8rem}
.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:20px;margin-bottom:20px}
.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.err{background:#3d1a1a;color:#eb5757;padding:10px 14px;border-radius:6px;font-size:.88rem;margin-bottom:12px}
.ok{background:#1a3d2b;color:#6fcf97;padding:10px 14px;border-radius:6px;font-size:.88rem;margin-bottom:12px}
label{display:block;font-size:.82rem;color:#888;margin-bottom:4px;margin-top:12px}
nav{margin-bottom:20px;color:#555}
#msg{display:none;margin-top:10px}
</style>
{% block head %}{% endblock %}
</head>
<body>
<nav><a href="/">← Users</a></nav>
{% block content %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
