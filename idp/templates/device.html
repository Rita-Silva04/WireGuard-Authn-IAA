{% extends "base.html" %}
{% block title %}VPN Login — Enter Code{% endblock %}
{% block content %}
<h1>🔐 VPN Authentication</h1>
<p class="sub">Enter the code shown in your terminal</p>

{% if error %}
<div class="err">{{ error }}</div>
{% endif %}

<form method="POST" action="/oauth/device/verify">
  <label>Activation Code</label>
  <input type="text" name="user_code" value="{{ prefill }}"
         placeholder="ABCD-EFGH" autocomplete="off"
         style="text-transform:uppercase;letter-spacing:.1em;font-size:1.3rem;text-align:center">

  <label>Username</label>
  <input type="text" name="username" placeholder="your username" autocomplete="username">

  <button class="btn btn-primary" type="submit">Continue →</button>
</form>
{% endblock %}
