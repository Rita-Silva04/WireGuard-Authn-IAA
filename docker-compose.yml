# Phase 0 baseline stack:
#   - idp        : Flask IdP + OAuth 2.0 Device Grant + MFA web routes
#   - helpdesk   : Flask enrolment UI
#   - srvauthn   : TLS auth server (port 9999) + WireGuard host (wg0)
#
# wg0 lives inside the srvauthn container, which runs with `network_mode: host`
# so the interface appears on the host's network namespace (no separate WG
# container is needed). For this to work, the host kernel must have the
# wireguard module (built-in on Linux kernel >= 5.6).
#
# The nginx reverse-proxy from the original colleague design has been removed
# - browsers hit IdP directly on :8080 and helpdesk on :8081.

services:

  # ── OAuth 2.0 IdP + MFA ────────────────────────────────────────────────────
  idp:
    build:
      context: .
      dockerfile: idp/Dockerfile
    container_name: vpn-idp
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DB_PATH=/data/vpnauth.db
      - RP_ID=${RP_ID:-localhost}
      - ORIGIN=${ORIGIN:-http://localhost:8080}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-srvauthn-secret}
      - IDP_PORT=8080
    volumes:
      - ./data:/data
      - ./idp:/app/idp
      - ./common:/app/common
    ports:
      - "8080:8080"
    restart: unless-stopped

  # ── Helpdesk (internal enrolment UI) ───────────────────────────────────────
  helpdesk:
    build:
      context: .
      dockerfile: idp/helpdesk/Dockerfile
    container_name: vpn-helpdesk
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DB_PATH=/data/vpnauth.db
      - RP_ID=${RP_ID:-localhost}
      - ORIGIN=${HELPDESK_ORIGIN:-http://localhost:8081}
      - HELPDESK_PORT=8081
    volumes:
      - ./data:/data
      - ./idp/helpdesk:/app/helpdesk
      - ./common:/app/common
    ports:
      - "8081:8081"          # Phase 1 step 1.7 binds this to 127.0.0.1 only.
    depends_on:
      - idp
    restart: unless-stopped

  # ── SrvAuthn (+ wg0) ───────────────────────────────────────────────────────
  srvauthn:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: vpn-srvauthn
    environment:
      - DB_PATH=/data/vpnauth.db
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-srvauthn-secret}
    volumes:
      - ./data:/data
      - ./certs:/certs
      - ./wireguard:/etc/wireguard
      - ./server:/app/server
      - ./common:/app/common
    network_mode: host          # wg0 sits on the host's network namespace
    cap_add:
      - NET_ADMIN               # required for `wg-quick up`
      - SYS_MODULE              # required to load the wireguard kernel module
    depends_on:
      - idp
    restart: unless-stopped
