services:

  # ── WireGuard VPN ──────────────────────────────────────────────────────────
  wireguard:
    image: linuxserver/wireguard
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Lisbon
      - SERVERURL=${SERVER_URL}
      - SERVERPORT=51820
      - PEERS=0
      - PEERDNS=1.1.1.1
      - INTERNAL_SUBNET=10.10.10.0
    volumes:
      - ./wireguard:/config
      - /lib/modules:/lib/modules
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped

  # ── OAuth 2.0 IdP + MFA ────────────────────────────────────────────────────
  idp:
    build:
      context: .
      dockerfile: idp/Dockerfile
    container_name: vpn-idp
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DB_PATH=/data/vpnauth.db
      - RP_ID=${RP_ID:-localhost}
      - ORIGIN=${ORIGIN:-http://localhost}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-srvauthn-secret}
      - IDP_PORT=8080
    volumes:
      - ./data:/data
      - ./idp:/app/idp
      - ./db:/app/db
      - ./rba:/app/rba
    ports:
      - "8080:8080"
    restart: unless-stopped

  # ── SrvAuthn TLS auth server ───────────────────────────────────────────────
  srvauthn:
    build:
      context: .
      dockerfile: srvauthn/Dockerfile
    container_name: vpn-srvauthn
    environment:
      - DB_PATH=/data/vpnauth.db
    volumes:
      - ./data:/data
      - ./certs:/certs
      - ./wireguard:/etc/wireguard
      - ./srvauthn:/app/srvauthn
      - ./db:/app/db
    network_mode: host          # needs access to wg0 interface
    cap_add:
      - NET_ADMIN
    depends_on:
      - idp
      - wireguard
    restart: unless-stopped

  # ── Helpdesk UI ────────────────────────────────────────────────────────────
  helpdesk:
    build:
      context: .
      dockerfile: helpdesk/Dockerfile
    container_name: vpn-helpdesk
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DB_PATH=/data/vpnauth.db
      - RP_ID=${RP_ID:-localhost}
      - ORIGIN=${HELPDESK_ORIGIN:-http://localhost:8081}
      - HELPDESK_PORT=8081
    volumes:
      - ./data:/data
      - ./helpdesk:/app/helpdesk
      - ./db:/app/db
    ports:
      - "8081:8081"
    depends_on:
      - idp
    restart: unless-stopped

  # ── Nginx reverse proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    entrypoint: >
      /bin/sh -c "rm -f /etc/nginx/sites-enabled/default &&
                  nginx -g 'daemon off;'"
    depends_on:
      - idp
      - helpdesk
    restart: unless-stopped
